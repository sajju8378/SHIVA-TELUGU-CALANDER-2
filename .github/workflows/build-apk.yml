name: Build & Deploy Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: |
          mkdir -p scripts
          if [ ! -f "scripts/postbuild.ts" ]; then
            echo "console.log('Postbuild step ready');" > scripts/postbuild.ts
          fi
          npm run build

      - name: Sync Web Build to Capacitor Android
        run: |
          if npx cap --version >/dev/null 2>&1; then
            npx cap sync android || echo "Capacitor sync skipped or completed"
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          mkdir -p build-output
          # 1. Try Gradle build if gradlew exists
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            cd android
            ./gradlew assembleDebug --stacktrace || true
            cd ..
          fi

          # 2. Check for Gradle-built APK or build using python script
          APK_FOUND=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            echo "Found Gradle APK at: $APK_FOUND"
            cp "$APK_FOUND" build-output/Telugu-Panchangam-2027.apk
          elif [ -f "scripts/build_apk.py" ]; then
            echo "Running local scripts/build_apk.py..."
            python3 scripts/build_apk.py
            cp public/downloads/telugu-panchangam-2027.apk build-output/Telugu-Panchangam-2027.apk
          else
            echo "Downloading and executing build_apk script..."
            curl -fsSL https://raw.githubusercontent.com/sajju8378/SHIVA-TELUGU-CALANDER/main/scripts/build_apk.py -o build_apk.py
            python3 build_apk.py
            cp public/downloads/telugu-panchangam-2027.apk build-output/Telugu-Panchangam-2027.apk
          fi

          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60

      - name: Deploy APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-apk' }}
          name: "Telugu Panchangam 2027 Android APK Release"
          draft: false
          prerelease: false
          body: |
            Telugu Panchangam 2027 Android APK Release
            Download and install Telugu-Panchangam-2027.apk on your Android device.
          files: |
            build-output/Telugu-Panchangam-2027.apk
